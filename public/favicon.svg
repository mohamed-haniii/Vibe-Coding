<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clinicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#clinicGrad)" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />
  
  <!-- Medical Stethoscope & Heart Silhouette -->
  <g transform="translate(100, 100) scale(0.61)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart pulse -->
    <path d="M 60 256 L 140 256 L 180 160 L 230 350 L 280 200 L 320 280 L 360 256 L 452 256" stroke="#38bdf8" stroke-width="26" />
    <!-- Scale base plate -->
    <path d="M 120 420 L 392 420" stroke="#ffffff" stroke-width="28" />
    <path d="M 256 120 L 256 420" stroke="#ffffff" stroke-width="24" />
    <path d="M 160 120 L 352 120" stroke="#ffffff" stroke-width="24" />
  </g>

  <!-- Green Nutrition Leaf -->
  <path d="M 370 120 C 370 120, 420 130, 430 190 C 440 250, 390 280, 390 280 C 390 280, 370 230, 320 210 C 270 190, 370 120, 370 120 Z" fill="url(#leafGrad)" />
  <path d="M 330 200 Q 380 210 420 180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>
